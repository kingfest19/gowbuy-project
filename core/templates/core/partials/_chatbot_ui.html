{% load static i18n %}

<style>
    #nexusChatbotContainer {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1050; /* Ensure it's above most other content */
        touch-action: none; /* Prevent scrolling while dragging */
    }

    #nexusChatbotToggleButton {
        background-color: var(--bs-dark, #212529); /* Match your site's dark theme */
        color: white;
        border: none;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        font-size: 28px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
     #nexusChatbotToggleButton:hover {
        background-color: var(--bs-primary, #3d3e3f); /* Use your site's primary blue for hover */
     }


    #nexusChatWindow {
        display: none; /* Hidden by default */
        position: absolute; /* Relative to container */
        bottom: 80px; /* Above the toggle button */
        right: 0; /* Default alignment */
        width: 370px; /* Slightly wider */
        max-width: 95vw;
        height: 450px;
        max-height: 70vh;
        background-color: rgba(255, 255, 255, 0.85);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border-radius: 8px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        flex-direction: column;
        overflow: hidden;
    }
    
    /* Alignment classes for the chat window */
    .chat-align-left #nexusChatWindow {
        left: 0;
        right: auto;
    }
    .chat-align-right #nexusChatWindow {
        right: 0;
        left: auto;
    }

    .nexus-chat-header {
        background-color: var(--bs-dark, #212529); /* Dark header */
        padding: 10px 15px;
        border-bottom: 1px solid #dee2e6;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .nexus-chat-header h5 {
        color: white;
        margin-bottom: 0;
        font-size: 1.1rem;
    }
    .nexus-chat-header-actions { display: flex; gap: 10px; }
    .nexus-chat-header .btn-icon {
        background: none;
        border: none;
        color: white;
        font-size: 1.2rem;
        cursor: pointer;
    }

    .nexus-chat-messages {
        flex-grow: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* Avatar & Message Row */
    .nexus-chat-message-row {
        display: flex;
        align-items: flex-end;
        margin-bottom: 5px;
    }
    .nexus-chat-avatar {
        width: 32px; height: 32px;
        background-color: var(--bs-primary);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin-right: 8px; color: white; flex-shrink: 0;
    }

    /* Message Column for AI (Text + Feedback) */
    .nexus-chat-message-col {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        max-width: 80%;
    }
    .nexus-chat-message-col .nexus-chat-message {
        max-width: 100%;
        border-bottom-left-radius: 5px;
    }

    /* Feedback Buttons & Timestamp */
    .nexus-chat-feedback {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
        margin-left: 5px;
        opacity: 0.6;
        transition: opacity 0.2s;
    }
    .nexus-chat-message-row:hover .nexus-chat-feedback { opacity: 1; }
    
    .btn-feedback {
        background: none; border: none; padding: 0;
        color: #adb5bd; font-size: 0.85rem; cursor: pointer;
    }
    .btn-feedback:hover { color: var(--bs-primary); }
    .btn-feedback.active { color: var(--bs-primary); }

    /* Styling for Markdown content */
    .nexus-chat-message.ai ul, .nexus-chat-message.ai ol {
        padding-left: 20px;
        margin-top: 5px;
        margin-bottom: 5px;
    }
    .nexus-chat-message.ai li { margin-bottom: 4px; }
    .nexus-chat-message.ai strong { font-weight: 600; }
    .nexus-chat-message.ai p { margin-bottom: 0.5rem; }
    .nexus-chat-message.ai p:last-child { margin-bottom: 0; }
    .nexus-chat-message.ai a {
        color: var(--bs-primary);
        text-decoration: underline;
    }


    .nexus-chat-message {
        padding: 8px 12px;
        border-radius: 15px;
        max-width: 80%;
        word-wrap: break-word;
    }

    .nexus-chat-message.user {
        background-color: var(--bs-primary, #0d6efd); /* Primary blue for user messages */
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 5px;
    }

    .nexus-chat-message.ai {
        background-color: #e9ecef;
        color: #333;
        align-self: flex-start; /* Fallback if not in row */
        border-bottom-left-radius: 5px;
    }
     .nexus-chat-message.error {
        background-color: var(--bs-danger-bg-subtle, #f8d7da);
        color: var(--bs-danger-text-emphasis, #721c24);
        border: 1px solid var(--bs-danger-border-subtle, #f5c6cb);
        align-self: flex-start;
     }

    /* Carousel for Products */
    .nexus-chat-carousel {
        display: flex;
        overflow-x: auto;
        gap: 12px;
        padding: 5px 5px 15px 5px;
        width: 100%;
        scrollbar-width: thin;
    }
    .nexus-chat-carousel::-webkit-scrollbar { height: 6px; }
    .nexus-chat-carousel::-webkit-scrollbar-thumb { background-color: #ccc; border-radius: 3px; }

    .nexus-chat-item-card {
        background-color: #fff;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 10px;
        display: flex;
        flex-direction: column; /* Stack content vertically */
        gap: 10px;
        text-decoration: none;
        color: inherit;
        transition: box-shadow 0.2s ease-in-out;
        min-width: 240px; /* Fixed width for carousel */
        width: 240px;
        flex-shrink: 0;
    }
    .nexus-chat-item-card:hover {
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        color: inherit;
    }
    .nexus-chat-item-card-header {
        display: flex;
        gap: 10px;
        align-items: center;
        width: 100%;
        cursor: pointer;
    }
    .nexus-chat-item-card-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        width: 100%;
    }
    .nexus-chat-item-card-actions .btn {
        flex-grow: 1;
    }
    .nexus-chat-item-card img {
        width: 60px;
        height: 60px;
        border-radius: 4px;
        object-fit: cover;
    }
    .nexus-chat-product-card-info h6 { margin-bottom: 2px; font-size: 0.9rem; }
    .nexus-chat-product-card-info p { margin-bottom: 0; font-size: 0.8rem; color: #6c757d; }

    /* Quick Reply Chips */
    .nexus-chat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 5px 0 10px 0; }
    .nexus-chat-chip {
        background-color: #f8f9fa; border: 1px solid #dee2e6;
        border-radius: 15px; padding: 4px 12px; font-size: 0.8rem;
        cursor: pointer; transition: all 0.2s; color: var(--bs-dark);
    }
    .nexus-chat-chip:hover {
        background-color: var(--bs-primary); color: white; border-color: var(--bs-primary);
    }

    .nexus-chat-input-area {
        padding: 10px;
        border-top: 1px solid #dee2e6;
        display: flex;
    }

    .nexus-chat-input-area input[type="text"] {
        flex-grow: 1;
        border: 1px solid #ced4da;
        border-radius: 20px;
        padding: 8px 15px;
        margin-right: 8px;
        font-size: 0.9rem;
    }
    .nexus-chat-input-area input[type="text"]:focus {
        outline: none;
        border-color: var(--bs-primary, #0d6efd);
        box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
    }

    .nexus-chat-input-area .btn-mic {
        background-color: transparent; color: #6c757d;
        width: 35px; height: 35px; margin-right: 5px; font-size: 1.1rem;
    }
    .nexus-chat-input-area .btn-mic:hover { background-color: #f8f9fa; color: var(--bs-primary); }
    .nexus-chat-input-area .btn-mic.listening { color: var(--bs-danger); animation: pulse 1.5s infinite; }

    .nexus-chat-input-area button {
        background-color: var(--bs-primary, #454545);
        color: white;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .nexus-chat-input-area button:hover {
        background-color: var(--bs-dark, #212529);
    }
    .nexus-chat-input-area button:disabled {
        background-color: #adb5bd;
        cursor: not-allowed;
    }
    .typing-indicator span {
        height: 8px;
        width: 8px;
        background-color: #adb5bd;
        border-radius: 50%;
        display: inline-block;
        margin: 0 2px;
        animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1.0); }
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

</style>

<div id="nexusChatbotContainer" class="chat-align-right">
    <button id="nexusChatbotToggleButton" aria-label="{% trans 'Open Chat' %}" aria-expanded="false">
        <i class="bi bi-chat-dots-fill"></i> <!-- Bootstrap Icon -->
    </button>

    <!-- Audio element for notification sound -->
    <audio id="nexusChatNotificationSound" src="{% static 'assets/sounds/notification.mp3' %}" preload="auto"></audio>

    <div id="nexusChatWindow">
        <div class="nexus-chat-header">
            <h5>{% trans "NEXUS Chat" %}</h5>
            <div class="nexus-chat-header-actions">
                <button class="btn-icon" id="nexusChatClearButton" title="{% trans 'Clear Chat' %}">
                    <i class="bi bi-trash"></i>
                </button>
                <button class="btn-icon" id="nexusChatCloseButton" aria-label="{% trans 'Close Chat' %}">&times;</button>
            </div>
        </div>
        <div class="nexus-chat-messages" id="nexusChatMessages" role="log" aria-live="polite" aria-atomic="false">
            <!-- Chat messages will appear here, aria-live will announce new messages -->
        </div>
        <div class="nexus-chat-input-area">
            <button class="btn-mic" id="nexusChatMicButton" title="{% trans 'Voice Input' %}"><i class="bi bi-mic-fill"></i></button>
            <input type="text" id="nexusChatMessageInput" placeholder="{% trans 'Type your message...' %}" aria-label="{% trans 'Chat message input' %}">
            <button id="nexusChatSendButton" aria-label="{% trans 'Send Message' %}">
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
    </div>
</div>

<!-- Markdown Parser Library -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const container = document.getElementById('nexusChatbotContainer');
    const toggleButton = document.getElementById('nexusChatbotToggleButton');
    const chatWindow = document.getElementById('nexusChatWindow');
    const closeButton = document.getElementById('nexusChatCloseButton');
    const clearButton = document.getElementById('nexusChatClearButton');
    const messagesContainer = document.getElementById('nexusChatMessages');
    const messageInput = document.getElementById('nexusChatMessageInput');
    const sendButton = document.getElementById('nexusChatSendButton');
    const micButton = document.getElementById('nexusChatMicButton');

    let conversationHistory = []; // Store conversation history

    // --- Load History from SessionStorage ---
    const savedHistoryHTML = sessionStorage.getItem('nexusChatHistoryHTML');
    const savedContext = sessionStorage.getItem('nexusChatContext');

    if (savedHistoryHTML) {
        messagesContainer.innerHTML = savedHistoryHTML;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    // If no history, show initial state
    if (!savedHistoryHTML) {
        addInitialState();
    }

    if (savedContext) {
        try {
            conversationHistory = JSON.parse(savedContext);
        } catch(e) { console.error("Error parsing chat context", e); }
    }

    // --- Auto-Open on Help Page ---
    const currentPath = window.location.pathname;
    const helpUrl = "{% url 'help' %}";
    if (currentPath === helpUrl) {
        // Open automatically if on the help page
        if (chatWindow.style.display !== 'flex') toggleChatWindow();
    }

    // --- Clear Chat Functionality ---
    clearButton.addEventListener('click', () => {
        if (confirm("{% trans 'Are you sure you want to clear the chat history?' %}")) {
            conversationHistory = [];
            messagesContainer.innerHTML = '';
            sessionStorage.removeItem('nexusChatHistoryHTML');
            sessionStorage.removeItem('nexusChatContext');
            addInitialState();
        }
    });

    function addInitialState() {
        addMessageToDisplay("{% trans 'Hello! How can I help you shop today?' %}", 'ai');
        addQuickReplyChips();
    }

    function addQuickReplyChips() {
        const chips = [
            "{% trans 'Track my Order' %}",
            "{% trans 'Return Policy' %}",
            "{% trans 'Speak to Human' %}"
        ];
        const chipsContainer = document.createElement('div');
        chipsContainer.classList.add('nexus-chat-chips');
        
        chips.forEach(text => {
            const chip = document.createElement('div');
            chip.classList.add('nexus-chat-chip');
            chip.textContent = text;
            chip.addEventListener('click', () => {
                messageInput.value = text;
                sendMessage();
            });
            chipsContainer.appendChild(chip);
        });
        messagesContainer.appendChild(chipsContainer);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        saveChatState();
    }

    // Function to toggle chat window visibility
    function toggleChatWindow() {
        const isOpen = chatWindow.style.display === 'flex';
        chatWindow.style.display = isOpen ? 'none' : 'flex';
        toggleButton.setAttribute('aria-expanded', String(!isOpen)); // Update aria-expanded
        toggleButton.innerHTML = isOpen ? '<i class="bi bi-chat-dots-fill"></i>' : '<i class="bi bi-x-lg"></i>';
        if (!isOpen) {
            messageInput.focus(); // Manage focus when opening
        }
    }

    // --- Draggable Logic ---
    let isDragging = false;
    let hasMoved = false;
    let startX, startY;

    function onDragStart(e) {
        // Only drag if touching the button or container (but not inside the window)
        if (e.target.closest('#nexusChatWindow')) return;
        
        isDragging = true;
        hasMoved = false;
        
        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);

        const rect = container.getBoundingClientRect();
        startX = clientX - rect.left;
        startY = clientY - rect.top;

        // Switch to fixed positioning with top/left to allow movement
        container.style.bottom = 'auto';
        container.style.right = 'auto';
        container.style.left = rect.left + 'px';
        container.style.top = rect.top + 'px';
    }

    function onDragMove(e) {
        if (!isDragging) return;
        e.preventDefault(); // Prevent scrolling
        hasMoved = true;

        const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
        const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);

        let newLeft = clientX - startX;
        let newTop = clientY - startY;

        // Boundary checks
        const winWidth = window.innerWidth;
        const winHeight = window.innerHeight;
        const rect = container.getBoundingClientRect();

        newLeft = Math.max(0, Math.min(newLeft, winWidth - rect.width));
        newTop = Math.max(0, Math.min(newTop, winHeight - rect.height));

        container.style.left = newLeft + 'px';
        container.style.top = newTop + 'px';

        // Update alignment class based on position
        if (newLeft < winWidth / 2) {
            container.classList.remove('chat-align-right');
            container.classList.add('chat-align-left');
        } else {
            container.classList.remove('chat-align-left');
            container.classList.add('chat-align-right');
        }
    }

    function onDragEnd() {
        isDragging = false;
    }

    toggleButton.addEventListener('mousedown', onDragStart);
    toggleButton.addEventListener('touchstart', onDragStart);
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('touchend', onDragEnd);

    toggleButton.addEventListener('click', (e) => {
        if (hasMoved) {
            e.preventDefault();
            e.stopPropagation();
            hasMoved = false;
            return;
        }
        toggleChatWindow();
    });
    closeButton.addEventListener('click', toggleChatWindow);

    function saveChatState() {
        sessionStorage.setItem('nexusChatHistoryHTML', messagesContainer.innerHTML);
        sessionStorage.setItem('nexusChatContext', JSON.stringify(conversationHistory));
    }

    // Function to add a message to the chat display
    function addMessageToDisplay(text, type) { // type can be 'user', 'ai', or 'error'
        if (type === 'ai') {
            // Play sound notification for new AI messages
            const notificationSound = document.getElementById('nexusChatNotificationSound');
            if (notificationSound) {
                notificationSound.play().catch(e => console.warn("Chat notification sound could not be played.", e));
            }

            const row = document.createElement('div');
            row.classList.add('nexus-chat-message-row');
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Parse markdown for AI responses if marked.js is loaded
            const messageContent = window.marked ? marked.parse(text) : text;

            row.innerHTML = `
                <div class="nexus-chat-avatar"><i class="bi bi-robot"></i></div>
                <div class="nexus-chat-message-col">
                    <div class="nexus-chat-message ai">${messageContent}</div>
                    <div class="nexus-chat-feedback">
                        <span style="font-size: 0.75rem; color: #adb5bd;">${time}</span>
                        <button class="btn-feedback" data-action="like" title="{% trans 'Helpful' %}"><i class="bi bi-hand-thumbs-up"></i></button>
                        <button class="btn-feedback" data-action="dislike" title="{% trans 'Not Helpful' %}"><i class="bi bi-hand-thumbs-down"></i></button>
                    </div>
                </div>
            `;
            messagesContainer.appendChild(row);
        } else {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('nexus-chat-message', type);
            messageDiv.textContent = text; // Use textContent for user/error to prevent HTML injection
            messagesContainer.appendChild(messageDiv);
        }
        messagesContainer.scrollTop = messagesContainer.scrollHeight; // Scroll to bottom
        saveChatState();
    }

    // Function to add item (product/service) cards to the chat display
    function addItemCardsToDisplay(items) {
        const carousel = document.createElement('div');
        carousel.classList.add('nexus-chat-carousel');
        
        // Get cart URL for Buy Now redirection
        const cartUrl = "{% url 'cart' %}";

        items.forEach(item => {
            const itemCard = document.createElement('div');
            itemCard.classList.add('nexus-chat-item-card');
            
            // Determine if it's a product or service for the "Add to Cart" URL
            const addToCartUrl = item.type === 'product' ? `{% url 'core:add_to_cart' 0 %}`.replace('0', item.id) : '#'; // Placeholder for service
            const addToCartDisabled = item.type !== 'product' ? 'disabled' : '';
            const addToCartTitle = item.type !== 'product' ? `{% trans "Booking services from chat is coming soon" %}` : `{% trans "Add to Cart" %}`;
            
            // Construct Buy Now URL (Add to cart then go to cart)
            const buyNowUrl = item.type === 'product' ? `${addToCartUrl}?next=${encodeURIComponent(cartUrl)}` : '#';

            itemCard.innerHTML = `
                <div class="nexus-chat-item-card-header" onclick="window.open('${item.url}', '_blank')" title="{% trans 'View Details' %}">
                    <img src="${item.image_url}" alt="${item.name}">
                    <div class="nexus-chat-item-card-info">
                        <h6>${item.name}</h6>
                        <p>GH₵ ${item.price}</p>
                    </div>
                </div>
                <div class="nexus-chat-item-card-actions">
                    <a href="${addToCartUrl}" class="btn btn-sm btn-outline-primary js-chat-add-to-cart" ${addToCartDisabled} title="${addToCartTitle}" data-name="${item.name}">
                        <i class="bi bi-cart-plus"></i> {% trans "Add" %}
                    </a>
                    <a href="${buyNowUrl}" class="btn btn-sm btn-primary js-chat-buy-now" ${addToCartDisabled} title="${addToCartTitle}" data-name="${item.name}">
                        <i class="bi bi-bag-check"></i> {% trans "Buy Now" %}
                    </a>
                </div>
            `;

            carousel.appendChild(itemCard);
        });
        messagesContainer.appendChild(carousel);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        saveChatState();
    }

    // Event delegation for Add to Cart and Buy Now buttons
    messagesContainer.addEventListener('click', function(e) {
        const btn = e.target.closest('.js-chat-add-to-cart, .js-chat-buy-now');
        if (btn && !btn.disabled) {
            e.preventDefault();
            const itemName = btn.getAttribute('data-name');
            const isBuyNow = btn.classList.contains('js-chat-buy-now');
            const actionText = isBuyNow ? "{% trans 'Buying' %}" : "{% trans 'Adding' %}";
            const actionSuffix = isBuyNow ? "..." : "{% trans 'to your cart...' %}";
            
            addMessageToDisplay(`${actionText} '${itemName}' ${actionSuffix}`, 'ai');
            window.location.href = btn.href;
        }
    });

    // Event delegation for Feedback buttons
    messagesContainer.addEventListener('click', function(e) {
        const btn = e.target.closest('.btn-feedback');
        if (btn) {
            const parent = btn.parentElement;
            parent.querySelectorAll('.btn-feedback').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            // Optional: Send feedback to server here
            console.log('User feedback:', btn.dataset.action);
        }
    });
    
    function showTypingIndicator() {
        const typingRow = document.createElement('div');
        typingRow.classList.add('nexus-chat-message-row', 'typing-indicator-row');
        typingRow.innerHTML = `
            <div class="nexus-chat-avatar"><i class="bi bi-robot"></i></div>
            <div class="nexus-chat-message ai typing-indicator" aria-label="{% trans 'AI is typing' %}">
                <span></span><span></span><span></span>
            </div>
        `;
        messagesContainer.appendChild(typingRow);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return typingRow;
    }

    function removeTypingIndicator(indicatorElement) {
        if (indicatorElement && indicatorElement.parentNode === messagesContainer) {
            messagesContainer.removeChild(indicatorElement);
        }
    }

    // --- Voice Input Logic ---
    if (micButton) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = '{{ LANGUAGE_CODE|default:"en-US" }}';
            
            micButton.addEventListener('click', () => {
                recognition.start();
                micButton.classList.add('listening');
            });
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                messageInput.value = transcript;
                messageInput.focus();
            };
            recognition.onend = () => { micButton.classList.remove('listening'); };
        } else {
            micButton.style.display = 'none';
        }
    }

    // Function to send message to backend
    async function sendMessage() {
        const userMessage = messageInput.value.trim();
        if (!userMessage) return;

        // Add to conversation history
        conversationHistory.push(`User: ${userMessage}`);
        if (conversationHistory.length > 6) conversationHistory.shift(); // Keep history short

        addMessageToDisplay(userMessage, 'user');
        messageInput.value = '';
        sendButton.disabled = true;
        
        const typingIndicator = showTypingIndicator();

        try {
            // Step 1: Get AI response and item IDs
            const response = await fetch("{% url 'core:ajax_chatbot_message' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}' // Make sure CSRF token is available
                },
                body: JSON.stringify({ 
                    message: userMessage,
                    history: conversationHistory.join('\n')
                })
            });

            removeTypingIndicator(typingIndicator);

            if (!response.ok) {
                let errorMsg = `{% trans "An unexpected error occurred. Status:" %} ${response.status}`;
                try {
                    const errData = await response.json();
                    // Use the specific error from backend if available
                    errorMsg = errData.error || `{% trans "Error from server:" %} ${errData.detail || JSON.stringify(errData)}`;
                } catch (e) { /* Ignore if response not JSON, use the status-based message */ }
                addMessageToDisplay(errorMsg, 'error');
                // Log the more detailed error to the console for debugging
                console.error('Chatbot backend error:', response.status, await response.text().catch(() => 'Could not read error response body'));
                sendButton.disabled = false;
                return;
            }

            const data = await response.json();

            // Handle cases where the backend returns a JSON object with an error key,
            // even with a 200 OK status. This is common for application-level errors.
            if (data.error) {
                addMessageToDisplay(data.error, 'error');
                sendButton.disabled = false;
                return;
            }

            // Display the AI's text response
            if (data.response_text) {
                addMessageToDisplay(data.response_text, 'ai');
                conversationHistory.push(`AI: ${data.response_text}`);
                if (conversationHistory.length > 6) conversationHistory.shift();
            }
            // If we have item IDs, fetch their details and display them
            const hasProducts = data.product_ids && data.product_ids.length > 0;
            const hasServices = data.service_ids && data.service_ids.length > 0;

            if (hasProducts || hasServices) {
                const itemDetailsResponse = await fetch("{% url 'core:ajax_get_item_details' %}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                    body: JSON.stringify({ product_ids: data.product_ids || [], service_ids: data.service_ids || [] })
                });
                const itemDetailsData = await itemDetailsResponse.json();
                if (itemDetailsData.items && itemDetailsData.items.length > 0) {
                    addItemCardsToDisplay(itemDetailsData.items);
                }
            }

            sendButton.disabled = false;

        } catch (error) {
            removeTypingIndicator(typingIndicator);
            sendButton.disabled = false;
            console.error('Chatbot fetch/network error:', error);
            const networkErrorMsg = "{% trans 'Network error or AI assistant is unavailable. Please try again.' %}";
            addMessageToDisplay(networkErrorMsg, 'error');
        }
        messageInput.focus();
    }

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
});
</script>
