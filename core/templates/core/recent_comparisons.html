{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Recent Comparisons" %}{% endblock %}

{% block content %}
<div class="container my-4">
<div class="card mb-4 shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-clock-history me-2"></i>{% trans "Recent Comparisons" %}</h5>
        <button id="clearRecentComparisonsBtn" class="btn btn-sm btn-outline-danger" style="display: none;">
            <i class="bi bi-trash"></i> {% trans "Clear History" %}
        </button>
    </div>
    <div class="card-body p-0">
        <div id="recentComparisonsList" class="list-group list-group-flush">
            <div class="text-center py-3 text-muted" id="noRecentComparisons">
                <small>{% trans "No recent comparisons found." %}</small>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const key = 'nexus_recent_comparisons';
        const recent = JSON.parse(localStorage.getItem(key)) || [];
        const container = document.getElementById('recentComparisonsList');
        const noDataMsg = document.getElementById('noRecentComparisons');
        const clearBtn = document.getElementById('clearRecentComparisonsBtn');
        
        if (recent.length > 0) {
            if(noDataMsg) noDataMsg.style.display = 'none';
            if(clearBtn) clearBtn.style.display = 'block';
            
            recent.forEach(item => {
                const link = document.createElement('a');
                link.href = item.url;
                link.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
                link.innerHTML = `
                    <div>
                        <span class="fw-bold text-primary"><i class="bi bi-arrow-left-right me-1"></i> ${item.count} {% trans "Products" %}</span>
                        <br>
                        <small class="text-muted" style="font-size: 0.8rem;">${item.date}</small>
                    </div>
                    <i class="bi bi-chevron-right text-muted"></i>
                `;
                container.appendChild(link);
            });
        }

        if (clearBtn) {
            clearBtn.addEventListener('click', function() {
                localStorage.removeItem(key);
                container.innerHTML = '';
                if(noDataMsg) noDataMsg.style.display = 'block';
                this.style.display = 'none';
            });
        }
    });
</script>
{% endblock %}
